<script>
  // 再生開始時の「ブチッ」を避けるため、先頭をほんの少しだけ飛ばす
  // ただし、読み込み前に無理にシークすると一瞬止まりやすいので、
  // メタデータが読めている時だけスキップします。
  const AUDIO_START_SKIP_SECONDS = 0.08;

  function prepareAudioForPlay(audio) {
    // preload=none の音声も、ユーザーが触れた時点で metadata 読み込みに切り替えます。
    if (audio && audio.readyState === 0) {
      audio.preload = "metadata";
      try {
        audio.load();
      } catch (e) {
        // 読み込み開始に失敗しても、再生ボタン本体の処理に任せる
      }
    }
  }

  function skipTinyStartIfReady(audio) {
    // HAVE_METADATA = 1 以上なら duration/currentTime を安全に扱いやすい。
    // まだ読み込めていない時は、ここで待たずにそのまま再生します。
    if (audio.readyState >= 1 && audio.currentTime < AUDIO_START_SKIP_SECONDS) {
      try {
        if (typeof audio.fastSeek === "function") {
          audio.fastSeek(AUDIO_START_SKIP_SECONDS);
        } else {
          audio.currentTime = AUDIO_START_SKIP_SECONDS;
        }
      } catch (e) {
        // シークできない場合は無理に止めず、そのまま再生する
      }
    }
  }

  document.addEventListener('play', function(e){
    const audios = document.getElementsByTagName('audio');

    for(let i = 0, len = audios.length; i < len; i++){
      if(audios[i] !== e.target){
        audios[i].pause();
        audios[i].currentTime = 0;
      }
    }
  }, true);
</script>

  const persistentPopupAudios = {};
  const INITIAL_AUDIO_PRELOAD_COUNT = 6;
  const MAX_PREPARED_AUDIOS = 8;
  const preparedAudioPool = new Map();

  function rememberAudioSrc(audio, src) {
    if (!audio.dataset.originalSrc) audio.dataset.originalSrc = src || audio.getAttribute("src") || audio.src || "";
  }

  function ensureAudioSrc(audio) {
    if (!audio) return;
    const src = audio.dataset.originalSrc;
    if (src && !audio.getAttribute("src")) {
      audio.src = src;
    }
  }

  function releaseAudioMemory(audio) {
    if (!audio || !audio.paused || audio.dataset.keepPrepared === "true") return;

    try {
      audio.pause();
      audio.removeAttribute("src");
      audio.load();
    } catch (e) {}

    audio.dataset.prepared = "false";
    preparedAudioPool.delete(audio);
  }

  function trimPreparedAudioPool() {
    const prepared = Array.from(preparedAudioPool.entries())
      .filter(([audio]) => audio && audio.paused && audio.dataset.keepPrepared !== "true")
      .sort((a, b) => a[1] - b[1]);

    while (preparedAudioPool.size > MAX_PREPARED_AUDIOS && prepared.length) {
      const [oldAudio] = prepared.shift();
      releaseAudioMemory(oldAudio);
    }
  }

  function markAudioRecentlyUsed(audio) {
    if (!audio) return;
    preparedAudioPool.set(audio, Date.now());
    trimPreparedAudioPool();
  }

  function warmAudioMetadata(audio) {
    if (!audio) return Promise.resolve();
    ensureAudioSrc(audio);
    markAudioRecentlyUsed(audio);
    if (audio.dataset.prepared === "true") return Promise.resolve();
    audio.dataset.prepared = "true";
    audio.preload = "metadata";

    return new Promise((resolve) => {
      let settled = false;
      const finish = () => {
        if (settled) return;
        settled = true;
        audio.removeEventListener("loadedmetadata", finish);
        audio.removeEventListener("canplay", finish);
        audio.removeEventListener("error", finish);
        resolve();
      };

      audio.addEventListener("loadedmetadata", finish, { once: true });
      audio.addEventListener("canplay", finish, { once: true });
      audio.addEventListener("error", finish, { once: true });

      try {
        audio.load();
      } catch (e) {
        finish();
      }

      setTimeout(finish, 1800);
    });
  }

  function hideLoadingOverlay() {
    const loadingOverlay = document.getElementById("loadingOverlay");
    if (loadingOverlay) loadingOverlay.classList.add("hidden");
  }

  function startInitialAudioLoading() {
    const firstAudios = renderedItems
      .slice(0, INITIAL_AUDIO_PRELOAD_COUNT)
      .map(item => item.audio)
      .filter(Boolean);

    const preloadJobs = firstAudios.map(audio => warmAudioMetadata(audio));

    Promise.race([
      Promise.all(preloadJobs),
      new Promise(resolve => setTimeout(resolve, 2200))
    ]).then(hideLoadingOverlay);
  }

  function setupAudioLazyLoading() {
    if (!("IntersectionObserver" in window)) {
      renderedItems.slice(0, INITIAL_AUDIO_PRELOAD_COUNT).forEach(item => warmAudioMetadata(item.audio));
      return;
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const matched = renderedItems.find(item => item.el === entry.target);
        if (matched && matched.audio) warmAudioMetadata(matched.audio);
      });
    }, {
      root: null,
      rootMargin: "900px 0px",
      threshold: 0
    });

    renderedItems.forEach(item => observer.observe(item.el));
  }

  // スマホで下までスクロールした後に音声が不安定になるのを避けるため、
  // 準備済み音声が増えすぎたら、再生していない古い音声を解放する。
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") {
      Array.from(preparedAudioPool.keys()).forEach(audio => {
        if (audio.paused) releaseAudioMemory(audio);
      });
    }
  });


  function getPersistentPopupAudio(src) {
    if (!persistentPopupAudios[src]) {
      const audio = document.createElement("audio");
      audio.src = src;
      rememberAudioSrc(audio, src);
      audio.preload = "none";
      audio.style.display = "none";
      audio.dataset.persistentPopupAudio = "true";
      document.body.appendChild(audio);
      persistentPopupAudios[src] = audio;
    }
    return persistentPopupAudios[src];
  }

  function createCustomAudioPlayer(src, options = {}) {
    const player = document.createElement("div");
    player.className = "custom-audio";

    const button = document.createElement("button");
    button.className = "custom-audio-button";
    button.type = "button";
    button.setAttribute("aria-label", "再生");

    const buttonLabel = document.createElement("span");
    buttonLabel.className = "custom-audio-button-label";
    buttonLabel.textContent = "▶";

    const buttonSpinner = document.createElement("span");
    buttonSpinner.className = "audio-loading-spinner";
    buttonSpinner.setAttribute("aria-hidden", "true");

    button.appendChild(buttonLabel);
    button.appendChild(buttonSpinner);

    const progressWrap = document.createElement("div");
    progressWrap.className = "custom-audio-progress-wrap";

    const ticks = document.createElement("div");
    ticks.className = "custom-audio-ticks";

    const progress = document.createElement("input");
    progress.className = "custom-audio-progress";
    progress.type = "range";
    progress.min = "0";
    progress.max = "1000";
    progress.value = "0";
    progress.step = "1";
    progress.setAttribute("aria-label", "再生位置");

    // ポップアップ内の音声だけは、閉じても止まらないように
    // audio要素をポップアップの外（body直下）に置く。
    const audio = options.persistent
      ? getPersistentPopupAudio(src)
      : document.createElement("audio");

    if (!options.persistent) {
      audio.src = src;
      rememberAudioSrc(audio, src);
      audio.preload = "none";
    }

    let rafId = null;
    let isTryingToPlay = false;
    let lastEarlyPlayMs = 0;
    let ignoreNextClick = false;
    let pendingPlayRequest = false;
    let playRetryTimer = null;
    let playAttemptId = 0;


    function setButtonState(state) {
      if (state === "loading") {
        player.classList.add("is-loading");
        button.setAttribute("aria-label", "読み込み中");
        return;
      }

      player.classList.remove("is-loading");

      if (state === "pause") {
        buttonLabel.textContent = "Ⅱ";
        button.setAttribute("aria-label", "一時停止");
      } else {
        buttonLabel.textContent = "▶";
        button.setAttribute("aria-label", "再生");
      }
    }

    function isAudioReadyToStart() {
      return audio.readyState >= 3; // HAVE_FUTURE_DATA
    }

    function getUsableDuration() {
      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        return audio.duration;
      }
      return 0;
    }

    function getRealCurrentTime() {
      return Number.isFinite(audio.currentTime) ? audio.currentTime : 0;
    }

    function updateTicks() {
      if (Number.isFinite(audio.duration) && audio.duration > 5) {
        const tickStep = (5 / audio.duration) * 100;
        ticks.style.setProperty("--tick-step", `${tickStep}%`);
        ticks.style.display = "";
      } else {
        ticks.style.display = "none";
      }
    }

    function updateProgress() {
      const duration = getUsableDuration();
      let value = "0";

      if (duration > 0) {
        const current = Math.min(getRealCurrentTime(), duration);
        value = String(Math.max(0, Math.min(1000, (current / duration) * 1000)));
      }

      progress.value = value;
      // iOS Safariでrangeの表示更新が遅れることがあるため、属性側も更新する。
      progress.setAttribute("value", value);
    }

    function startVisualProgress() {
      if (rafId !== null) return;

      const tick = () => {
        updateProgress();
        if (isTryingToPlay || !audio.paused) {
          rafId = requestAnimationFrame(tick);
        } else {
          rafId = null;
        }
      };

      rafId = requestAnimationFrame(tick);
    }

    function stopVisualProgress() {
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    }

    function showPlayingStateImmediately() {
      setButtonState("pause");

      if (!isTryingToPlay) {
        isTryingToPlay = true;
      }

      updateTicks();
      updateProgress();
      startVisualProgress();
    }

    function showPausedState() {
      pendingPlayRequest = false;
      isTryingToPlay = false;
      playAttemptId++;
      if (playRetryTimer) {
        clearTimeout(playRetryTimer);
        playRetryTimer = null;
      }
      setButtonState("play");
      updateProgress();
      stopVisualProgress();
    }

    function stopPlaybackByUser() {
      pendingPlayRequest = false;
      isTryingToPlay = false;
      playAttemptId++;
      if (playRetryTimer) {
        clearTimeout(playRetryTimer);
        playRetryTimer = null;
      }
      audio.dataset.keepPrepared = "false";
      audio.pause();
      setButtonState("play");
      updateProgress();
      stopVisualProgress();
    }

    function schedulePlayRetry(delay = 180) {
      if (!pendingPlayRequest || !audio.paused) return;
      if (playRetryTimer) clearTimeout(playRetryTimer);
      playRetryTimer = setTimeout(() => {
        playRetryTimer = null;
        if (pendingPlayRequest && audio.paused) {
          tryPlayNow(true);
        }
      }, delay);
    }

    function tryPlayNow(isRetry = false) {
      ensureAudioSrc(audio);
      markAudioRecentlyUsed(audio);
      prepareAudioForPlay(audio);

      // 読み込みだけで止まった時も、ユーザーの再生意思を保持する。
      pendingPlayRequest = true;
      isTryingToPlay = true;

      if (isAudioReadyToStart()) {
        showPlayingStateImmediately();
      } else {
        setButtonState("loading");
        updateTicks();
        updateProgress();
        startVisualProgress();
      }

      skipTinyStartIfReady(audio);

      const thisAttempt = ++playAttemptId;
      let playPromise;
      try {
        playPromise = audio.play();
      } catch (e) {
        schedulePlayRetry(isRetry ? 350 : 180);
        return;
      }

      if (playPromise && typeof playPromise.then === "function") {
        playPromise.then(() => {
          if (thisAttempt !== playAttemptId) return;
          audio.dataset.keepPrepared = "true";
          markAudioRecentlyUsed(audio);

          // iOSでplay()が解決しても一瞬pausedのままになることがあるため保険をかける。
          setTimeout(() => {
            if (pendingPlayRequest && audio.paused) {
              schedulePlayRetry(80);
            }
          }, 120);

          // 実再生に入ったあとも、最初のcurrentTime反映遅れを少し吸収する。
          setTimeout(() => {
            if (!audio.paused) {
              isTryingToPlay = false;
                    }
          }, 700);
          startVisualProgress();
        }).catch(() => {
          if (thisAttempt !== playAttemptId) return;

          // スマホでは、まだ読み込み中のaudio.play()が一度失敗することがある。
          // その場合は停止表示に戻さず、canplay/loadeddata後に再試行する。
          if (pendingPlayRequest) {
            setButtonState("loading");
            schedulePlayRetry(isRetry ? 450 : 220);
          } else {
            audio.dataset.keepPrepared = "false";
            showPausedState();
          }
        });
      } else {
        schedulePlayRetry(300);
      }
    }

    function startPlayback() {
      if (!audio.paused && !isTryingToPlay) return;
      tryPlayNow(false);
    }

    // スマホでは click まで待つとUI反応が遅れることがあるため、
    // タッチの場合は pointerdown/touchstart の時点で再生と表示更新を始める。
    button.addEventListener("pointerdown", (e) => {
      prepareAudioForPlay(audio);
      if (e.pointerType === "touch" || e.pointerType === "pen") {
        lastEarlyPlayMs = Date.now();
        ignoreNextClick = true;
        if (audio.paused || isTryingToPlay || pendingPlayRequest) {
          startPlayback();
        } else {
          stopPlaybackByUser();
        }
      }
    });

    button.addEventListener("touchstart", () => {
      // pointerdown が来ない環境向けの保険。
      if (Date.now() - lastEarlyPlayMs > 500) {
        lastEarlyPlayMs = Date.now();
        ignoreNextClick = true;
        if (audio.paused || isTryingToPlay || pendingPlayRequest) {
          startPlayback();
        } else {
          stopPlaybackByUser();
        }
      }
    }, { passive: true });

    button.addEventListener("mouseenter", () => {
      prepareAudioForPlay(audio);
    });

    button.addEventListener("focus", () => {
      prepareAudioForPlay(audio);
    });

    button.addEventListener("click", () => {
      // タッチ時は pointerdown/touchstart ですでに再生を始めているので、
      // その後に遅れて届く click で誤って一時停止しないようにする。
      // 時間ではなくフラグで1回だけ確実に無視する。
      if (ignoreNextClick) {
        ignoreNextClick = false;
        return;
      }

      if (audio.paused) {
        startPlayback();
      } else {
        stopPlaybackByUser();
      }
    });

    audio.addEventListener("loadedmetadata", () => {
      updateTicks();
      updateProgress();
    });

    audio.addEventListener("durationchange", () => {
      updateTicks();
      updateProgress();
    });

    audio.addEventListener("play", () => {
      if (isAudioReadyToStart()) {
        setButtonState("pause");
        startVisualProgress();
      } else {
        setButtonState("loading");
      }
    });

    audio.addEventListener("pause", () => {
      audio.dataset.keepPrepared = "false";
      markAudioRecentlyUsed(audio);

      // 再生開始直後の一瞬のpauseは、スマホでロード待ち中に起きることがある。
      // ユーザーが再生を押した直後なら、停止表示に戻さず再試行する。
      if (!audio.ended && pendingPlayRequest && isTryingToPlay) {
        setButtonState("loading");
        schedulePlayRetry(180);
        return;
      }

      if (!audio.ended) {
        showPausedState();
      }
    });

    audio.addEventListener("ended", () => {
      pendingPlayRequest = false;
      isTryingToPlay = false;
      setButtonState("play");
      progress.value = "0";
      progress.setAttribute("value", "0");
      audio.dataset.keepPrepared = "false";
      markAudioRecentlyUsed(audio);
      stopVisualProgress();
    });

    audio.addEventListener("waiting", () => {
      if (isTryingToPlay || !audio.paused) {
        setButtonState("loading");
      }
    });

    audio.addEventListener("stalled", () => {
      if (isTryingToPlay || !audio.paused) {
        setButtonState("loading");
      }
    });

    audio.addEventListener("canplay", () => {
      if (pendingPlayRequest && audio.paused) {
        tryPlayNow(true);
        return;
      }
      if (isTryingToPlay || !audio.paused) {
        setButtonState("pause");
        startVisualProgress();
      }
    });

    audio.addEventListener("loadeddata", () => {
      if (pendingPlayRequest && audio.paused) {
        tryPlayNow(true);
      }
    });

    audio.addEventListener("playing", () => {
      pendingPlayRequest = false;
      setButtonState("pause");
      isTryingToPlay = false;
      startVisualProgress();
    });

    audio.addEventListener("timeupdate", updateProgress);

    progress.addEventListener("input", () => {
      const duration = getUsableDuration();
      if (duration) {
        audio.currentTime = (Number(progress.value) / 1000) * duration;
          updateProgress();
      }
    });

    updateTicks();
    updateProgress();
    progressWrap.appendChild(ticks);
    progressWrap.appendChild(progress);
    player.appendChild(button);
    player.appendChild(progressWrap);

    if (!options.persistent) {
      player.appendChild(audio);
    }

    player.audioElement = audio;
    player.prepareAudio = () => warmAudioMetadata(audio);

    return player;
  }

      mapJumpButton.onclick = () => goToMapFromList(file, index);
      wrapper.appendChild(mapJumpButton);

      const audio = createCustomAudioPlayer(file.name, { preload: "none" });

      const comment = document.createElement("div");
      comment.className = "comment";
      // comment 内の <br> を改行として表示する
      comment.innerHTML = file.comment;

      content.appendChild(titleEl);
      content.appendChild(wrapper);
      content.appendChild(audio);
      content.appendChild(comment);

      item.appendChild(content);
      fileList.appendChild(item);

      renderedItems.push({
        el: item,
        index: index,
        audio: audio.audioElement,
        searchText: (file.title + " " + file.comment).toLowerCase()
      });
    });

    const unmatchedDivider = document.createElement("div");
    unmatchedDivider.id = "unmatchedDivider";
    fileList.appendChild(unmatchedDivider);
  }

  function filterList(filter = "") {
    const q = filter.toLowerCase().trim();
    const keywords = q.split(/\s+/).filter(Boolean);
    const unmatchedDivider = document.getElementById("unmatchedDivider");
    let hitCount = 0;

    renderedItems.forEach(({ el, index, searchText }) => {
      const match = keywords.length === 0 || keywords.every(keyword => searchText.includes(keyword));
      el.style.display = "";

      if (keywords.length === 0) {
        el.style.order = index;
      } else if (match) {
        el.style.order = index;
        hitCount++;
      } else {
        el.style.order = 10000 + index;
      }
    });

    if (keywords.length === 0) {
      noResultsMessage.style.display = "none";
      unmatchedDivider.style.display = "none";
    } else if (hitCount === 0) {
      noResultsMessage.style.display = "block";
      unmatchedDivider.style.display = "block";
      unmatchedDivider.style.order = 0;
    } else {
      noResultsMessage.style.display = "none";
      unmatchedDivider.style.display = "block";
      unmatchedDivider.style.order = 9999;
    }
  }

  function scrollItemToCenter(target) {
    if (!target) return;

    const rect = target.getBoundingClientRect();
    const targetTop = window.pageYOffset + rect.top;
    const centeredTop = targetTop - (window.innerHeight / 2) + (rect.height / 2);

    window.scrollTo({
      top: Math.max(centeredTop, 0),
      behavior: 'smooth'
    });
  }

  function closeModal(e) {
    if (e.target === modal || e.target === modalImg) {
      modal.classList.remove("show");

      // ✕ボタン削除
      const closeBtn = document.getElementById('modalCloseButton');
      if (closeBtn) closeBtn.remove();

      // UI要素を再表示
      const uiElements = [
        document.getElementById("summaryButton"),
        document.getElementById("topButton"),
        document.getElementById("fullscreenMapButton")
      ];
      uiElements.forEach(el => el && (el.style.display = ''));
    }
  }
  window.closeModal = closeModal;

  // === 概要表示の要素取得 ===
  const summaryBtn = document.getElementById("summaryButton");
  const summaryBox = document.getElementById("summaryBox");
  const closeSummary = document.getElementById("closeSummary");

  // === ボタンで開閉 ===
  function toggleSummary() {
    const isVisible = summaryBox.style.display === "block";
    summaryBox.style.display = isVisible ? "none" : "block";
  }
  summaryBtn.addEventListener("click", toggleSummary);

  // === ×ボタンで閉じる ===
  closeSummary.addEventListener("click", () => {
    summaryBox.style.display = "none";
  });

  // === ボックス外をクリックしたら閉じる ===
  document.addEventListener("click", (event) => {
    const isInside = summaryBox.contains(event.target) || summaryBtn.contains(event.target);
    if (!isInside) {
      summaryBox.style.display = "none";
    }
  });


  function createMapPopupContent(file, index, id) {
    const popupContent = document.createElement("div");
    popupContent.className = "map-popup-content";

    const title = document.createElement("strong");
    title.className = "map-popup-title";
    title.textContent = file.title;
    popupContent.appendChild(title);

    const img = document.createElement("img");
    img.src = file.images[0];
    img.className = "map-popup-image";

    // ★軽量化：遅延読み込み
    img.loading = "lazy";
    img.decoding = "async";

    img.onclick = () => showModalWithImage(img.src);

    popupContent.appendChild(img);

    const audio = createCustomAudioPlayer(file.name, { persistent: true });
    audio.prepareAudio();

    popupContent.appendChild(audio);

    const button = document.createElement("button");
    button.textContent = "詳細へ移動";
    button.className = "map-popup-detail-button";
    button.onclick = () => {
      const target = document.getElementById(id);

      if (isFullscreen) {
        document.getElementById('map').classList.remove('fullscreen-map');
        document.getElementById('fullscreenMapButton').textContent = '拡大';
        isFullscreen = false;
        map.invalidateSize();
        if (openedPopup) openedPopup.openPopup();

        setTimeout(() => scrollItemToCenter(target), 120);
      } else {
        scrollItemToCenter(target);
      }
    };
    popupContent.appendChild(button);

    return popupContent;
  }

  // === Map ===
  const map = L.map('map').setView([36.2, 138.2], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  files.forEach((file, index) => {
    if (file.lat && file.lng) {
      const id = `item-${index}`;
      const marker = L.marker([file.lat, file.lng]).addTo(map);

      marker.bindPopup(() => createMapPopupContent(file, index, id));
      markers.push(marker);
    } else {
      markers.push(null);
    }
  });

  // ★重要：リストは1回だけ作って、検索は表示切替のみ
  buildListOnce();
  filterList("");
  startInitialAudioLoading();
  setupAudioLazyLoading();

  // ★検索：検索窓自体は固定せず、入力時に検索窓が画面上部へ来るようにする
  let _searchTimer = null;

  function scrollSearchToTop() {
    const rect = searchInput.getBoundingClientRect();
    const targetTop = window.pageYOffset + rect.top - 12;

    window.scrollTo({
      top: Math.max(targetTop, 0),
      behavior: "auto"
    });
  }

  searchInput.addEventListener("focus", () => {
    scrollSearchToTop();
  });

  searchInput.addEventListener("input", () => {
    scrollSearchToTop();

    if (_searchTimer) clearTimeout(_searchTimer);
    _searchTimer = setTimeout(() => {
      filterList(searchInput.value);
      scrollSearchToTop();
    }, 150);
  });
</script>

<!-- ★ 地図最大化ボタン（重複していたスクリプトは1本化） -->
<script>
  const fullscreenBtn = document.getElementById("fullscreenMapButton");
  let isFullscreen = false;
  let openedPopup = null;

  fullscreenBtn.addEventListener("click", () => {
    openedPopup = map._popup && map._popup._source;

    let openedPopupMarker = null;
    markers.forEach(marker => {
      if (marker && marker.getPopup && marker.getPopup() && marker.getPopup().isOpen()) {
        openedPopupMarker = marker;
      }
    });

    const mapElement = document.getElementById("map");

    if (!isFullscreen) {
      mapElement.classList.add("fullscreen-map");
      fullscreenBtn.textContent = "縮小";
    } else {
      mapElement.classList.remove("fullscreen-map");
      fullscreenBtn.textContent = "拡大";
    }

    isFullscreen = !isFullscreen;

    setTimeout(() => {
      map.invalidateSize();
      if (openedPopup) openedPopup.openPopup();
      if (openedPopupMarker) openedPopupMarker.openPopup();
    }, 300);
  });

  document.getElementById("topButton").addEventListener("click", () => {
    const mapElement = document.getElementById("map");
    if (isFullscreen) {
      mapElement.classList.remove("fullscreen-map");
      fullscreenBtn.textContent = "拡大";
      map.invalidateSize();
      if (openedPopup) openedPopup.openPopup();
      isFullscreen = false;
    }
  });
</script>
